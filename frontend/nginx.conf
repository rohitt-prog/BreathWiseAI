# ==============================================================================
# BreatheWise AI — Frontend Nginx Configuration
# Unprivileged Nginx configuration for Vite/React SPA + FastAPI Reverse Proxy
# ==============================================================================

server {
    listen 8080;
    server_name localhost;

    # Security: Disable emitting Nginx version in error pages and Server header
    server_tokens off;

    # Root directory containing built Vite static assets
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Security Headers
    # Note: Content-Security-Policy (CSP) is explicitly deferred pending end-to-end
    # integration testing to prevent breaking Firebase Auth, Google OAuth,
    # Firestore WebChannels, and Open-Meteo Geocoding APIs.
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # --------------------------------------------------------------------------
    # Reverse Proxy: Backend API Routes (/api/)
    # Forwards requests to the internal Docker Compose backend service on port 8000.
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;

        # Forwarding headers preserving client IP and scheme
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Clean error pass-through (preserves backend JSON error contracts)
        proxy_intercept_errors off;
    }

    # --------------------------------------------------------------------------
    # Reverse Proxy: Health Endpoint (/health)
    # Allows external probes and health checks to inspect backend status via Nginx.
    # --------------------------------------------------------------------------
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        proxy_intercept_errors off;
    }

    # --------------------------------------------------------------------------
    # Static Assets: Hashed Vite Bundles (/assets/)
    # Content-hashed chunks receive immutable long-term caching.
    # Missing assets return 404 rather than silently falling back to index.html.
    # --------------------------------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Application Entrypoint: index.html
    # Must never be cached to ensure clients always fetch the latest release.
    # --------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # --------------------------------------------------------------------------
    # SPA Route Fallback
    # Client-side routing: all non-file URI requests fall back to index.html.
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error handling for unexpected server errors
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
